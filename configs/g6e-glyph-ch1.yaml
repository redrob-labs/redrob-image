# Glyph pilot ch1: the glyph latent is concatenated to the noisy latent on extra input channels (scripts/glyph.py
# channel mode). A zero-initialised linear embeds the glyph half of every patch and adds it to the image token at the
# same place, so the strokes reach the token they describe. The omni-mode pilot (g6e-glyph-v1) only mixed the glyph in
# as a hint (swap test at steps 3141 and 5007: 0/10 drew the glyph text).
# Starts from the finished r64 v2 LoRA, so this run is "r64 v2 + glyph channel"; 15% of batches get a zero glyph,
# which is exactly r64 v2. Reuses the glyph pre-compute (glyph latents are the same; omni segments are unused).
# HF_HOME=~/hf python scripts/train_lora.py --config configs/g6e-glyph-ch1.yaml --run ~/runs/pilot-glyph-ch1
model: Tongyi-MAI/Z-Image
precomp: ~/data/precomp-glyph
init_lora: ~/runs/pilot-r64v2/final/pytorch_lora_weights.safetensors
s3: ""
seed: 0
mix:
  aihub105: 20000
  synth: 20000
variants: [ko_long, ko_short, en]
caption_dropout: 0.1
gradient_checkpointing: true
glyph:
  enabled: true
  mode: channel
  dropout: 0.15                  # share of batches trained with a zero glyph
  proj_lr_mult: 1.0
lora:
  rank: 64
  alpha: 64
  targets: [to_q, to_k, to_v, to_out.0, feed_forward.w1, feed_forward.w2, feed_forward.w3]
loss:
  text_weight: 5.0
timesteps:
  dist: logit_normal
  mean: 0.0
  std: 1.0
optim:
  lr: 1.0e-4
  warmup: 100
  max_grad_norm: 1.0
stages:
  - {res: 512, batch: 8, epochs: 1, min_text_px: 16}
  - {res: 1024, batch: 2, steps: 1500}
ckpt_minutes: 30
val:
  precomp: ~/data/precomp-val-glyph
  glyph: channel
  res: 512
  every: 1000
  max_per_source: 128
  levels: 8
  seed: 1234
  variant: ko_long
eval:
  every: 1000
  glyph: channel
  prompts: [eval/prompts.jsonl]
  subset: 40
  seeds: [42]
  resolution: 1024
  steps: 28
  guidance: 4.0
