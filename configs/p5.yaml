# Path B: full fine-tuning of Z-Image (Base) on one p5.48xlarge (8x H100 80 GB). DO NOT LAUNCH without approval.
# torchrun --nproc-per-node 8 scripts/train_full.py --config configs/p5.yaml --run /opt/dlami/nvme/runs/pathb-v1
model: Tongyi-MAI/Z-Image
precomp: /opt/dlami/nvme/precomp   # synced from s3://<bucket>/precomp/ before start (see docs/path-b-runbook.md)
s3: ""                             # s3://<private bucket>/runs/pathb-v1 -- required on p5 (spot/CB end loses the NVMe)
seed: 0
mix:                               # samples per source at each resolution; 0 = all available
  aihub105: 0                      # ~0.4-0.5M crops + full scenes after the full download and scripts/aihub105_parse.py
  aihub81: 0                       # text-in-the-wild scenes (parser still to write)
  nvidia_ocr_ko: 300000            # CC BY 4.0, attribution in NOTICE; human sign-off pending
  synth: 500000                    # synth/generate.py --stage 2
  realism: 600000                  # Z-Image Base self-generated + PD12M, recaptioned (keeps general quality)
variants: [ko_long, ko_short, en]
caption_dropout: 0.1
gradient_checkpointing: true
optim:
  lr: 2.0e-5
  beta2: 0.99
  warmup: 500
  weight_decay: 0.0
  max_grad_norm: 1.0
stages:
  - {res: 512, batch: 16, epochs: 1}      # per GPU; global batch 128
  - {res: 1024, batch: 4, steps: 6000}    # global batch 32
ckpt_minutes: 30
