# Pilot LoRA on g6e.xlarge (L40S 48 GB) or the gpu-box (same GPU).
# HF_HOME=~/hf python scripts/train_lora.py --config configs/g6e.yaml --run ~/runs/pilot-r32
model: Tongyi-MAI/Z-Image
precomp: ~/data/precomp          # scripts/precompute.py output (needs 512/ and 1024/)
s3: ""                           # s3://<private bucket>/runs/<name> once infra/s3_bucket.py has made one
seed: 0
mix:                             # samples per source; 0 = all
  aihub105: 20000
  synth: 20000
variants: [ko_long, ko_short, en]
caption_dropout: 0.1             # keeps the empty-prompt branch Base needs for CFG
gradient_checkpointing: true
lora:
  rank: 32                       # run again with --rank 64 for the ablation
  alpha: 32
  targets: [to_q, to_k, to_v, to_out.0]
optim:
  lr: 1.0e-4
  warmup: 100
  max_grad_norm: 1.0
stages:
  - {res: 512, batch: 8, epochs: 2}
  - {res: 1024, batch: 2, steps: 1500}
ckpt_minutes: 30
val:                             # stable validation loss on held-out data (scripts/train_lora.py StableVal)
  precomp: ~/data/precomp-val    # AI Hub 81 (never trained on) + synth seed 99, scripts/precompute.py output
  res: 512
  every: 500
  levels: 8                      # t = 1/16, 3/16, ..., 15/16
  seed: 1234
  variant: ko_long
eval:
  every: 2500
  prompts: [eval/prompts.jsonl]
  subset: 40
  seeds: [42]
  resolution: 1024
  steps: 28
  guidance: 4.0
